name: Sync from upstream bulwarkmail/webmail

on:
  schedule:
    - cron: '0 4 * * *' # daily at 4am UTC
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "irsal-bot"
          git config user.email "support@irsal.cloud"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/bulwarkmail/webmail.git || true

      - name: Fetch upstream
        run: git fetch upstream

      - name: Checkout or create sync branch
        run: |
          git checkout sync/upstream 2>/dev/null || git checkout -b sync/upstream

      - name: Merge upstream main
        run: |
          git merge upstream/main --no-edit || true

      - name: Push sync branch
        run: git push origin sync/upstream

      - name: Open PR if changes exist
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          gh pr create \
            --base main \
            --head sync/upstream \
            --title "chore: sync with bulwarkmail/webmail $(date +'%Y-%m-%d')" \
            --body "Automated upstream sync from bulwarkmail/webmail. Review for conflicts with IrsalMail branding before merging." \
            || echo "PR already exists or no changes"
